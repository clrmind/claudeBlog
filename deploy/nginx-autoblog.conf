# AutoBlogger 컨트롤 패널 리버스 프록시 (선택 — 상시 도메인 접속용)
# ---------------------------------------------------------------------------
# 설치:
#   1) DNS: autoblog.zionlabs.org (A) → 158.247.239.7  (Cloudflare면 프록시 켜도 됨)
#   2) sudo cp deploy/nginx-autoblog.conf /etc/nginx/sites-available/autoblog
#      sudo ln -s /etc/nginx/sites-available/autoblog /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3) HTTPS:  sudo certbot --nginx -d autoblog.zionlabs.org
#
# 주의: 블로그 본체(blog.zionlabs.org)는 GitHub Pages가 호스팅하므로 여기 설정과 무관.
#       이 nginx는 '관리용 컨트롤 패널(webui.py, 8091)'만 외부로 연결한다.
server {
    listen 80;
    server_name autoblog.zionlabs.org;

    # 파일 업로드(대표 이미지 직접 첨부) 여유
    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # 발행이 오래 걸려도 끊기지 않도록
    }
}
